name: JMCGPT session checks
on:
  pull_request:
    paths:
      - 'src/frontend/**'
      - 'deploy/jmcgpt-session/**'
      - '.github/workflows/jmcgpt-session-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        working-directory: src/frontend
        run: npm exec --yes --package=pnpm@10.6.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Test and build
        working-directory: src/frontend
        run: npm test && npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Test privacy and model adapter
        env:
          PYTHONPATH: deploy/jmcgpt-session
        run: python -m unittest discover -s deploy/jmcgpt-session/tests -v
      - name: Verify source-only build context
        run: python deploy/jmcgpt-session/package.py --output /tmp/jmcgpt-session-context.tar.gz
